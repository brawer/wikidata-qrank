name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  # Weekly, so newly published vulnerabilities (govulncheck) surface even
  # when nothing is pushed.
  schedule:
    - cron: "23 5 * * 1"

permissions: {}

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: Check REUSE Compliance
      uses: fsfe/reuse-action@v6

    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Build
      run: |
        go build -ldflags="-s -w" -v ./cmd/...

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

    # Known vulnerabilities that the code actually calls, in dependencies
    # and in the standard library of the Go version pinned in go.mod.
    - name: Check for known vulnerabilities
      run: govulncheck ./...

    - name: Test
      run: go test -v ./...

  # On a release tag (vX.Y.Z, pushed by release-please), ask the Toolforge
  # components API to rebuild the image and recreate the components
  # (see toolforge.yaml, RELEASING.md).
  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Trigger and await the Toolforge deployment
      env:
        TOKEN: ${{ secrets.TOOLS_DEPLOY_TOKEN }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        api="https://api.svc.toolforge.org/components/v1/tool/qrank/deployment"
        body=$(jq -n --arg d "release $TAG" '{description: $d}')
        resp=$(curl --fail-with-body -sS -X POST --json "$body" "$api?token=$TOKEN")
        echo "$resp" | jq .
        id=$(echo "$resp" | jq -r '.data.deploy_id')
        echo "deployment: $id"
        for _ in $(seq 1 80); do
          sleep 15
          resp=$(curl --fail-with-body -sS "$api/$id?token=$TOKEN")
          status=$(echo "$resp" | jq -r '.data.status')
          echo "status: $status"
          case "$status" in
            pending|running) ;;
            successful) echo "deployed $TAG"; exit 0 ;;
            *)
              # The full record names the failing component and why
              # (for example a build error), which the bare status hides.
              echo "$resp" | jq .
              echo "::error::Toolforge deployment $id $status; see RELEASING.md"
              exit 1 ;;
          esac
        done
        echo "gave up waiting for deployment $id"
        exit 1
