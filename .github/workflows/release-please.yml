#
# Keeps an open "release" pull request that updates CHANGELOG.md and the version
# from the Conventional Commit history.  Merging that PR pushes the X.Y.Z tag and
# creates the GitHub release; the tag push then runs build-test.yml, whose
# `deploy` job redeploys to Toolforge.  See RELEASING.md.
#
# It runs as a GitHub App (brawer-release-bot, shared with brawer/osmviews) rather than the built-in
# GITHUB_TOKEN: GitHub does not start workflows from GITHUB_TOKEN pushes, so with
# the built-in token the release PR's CI would need manual approval and the tag
# would not launch the deploy.  App setup is in RELEASING.md.

name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch: # kick a run by hand if a push-triggered one was skipped

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions: {}
    # Skip (rather than fail every push to main) until the App is configured.
    if: vars.RELEASE_PLEASE_APP_CLIENT_ID != ''
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write # tag + GitHub release
          permission-pull-requests: write # open and update the release PR

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
